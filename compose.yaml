name: event-lab
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: eventlab
      POSTGRES_USER: learner
      POSTGRES_PASSWORD: learning-only
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learner -d eventlab"]
      interval: 5s
      timeout: 5s
      retries: 20
  kafka-volume-init:
    image: alpine:3.22
    user: "0:0"
    command: ["chown", "1000:1000", "/data"]
    volumes: ["kafka-data:/data"]
  kafka:
    depends_on:
      kafka-volume-init: {condition: service_completed_successfully}
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes: ["kafka-data:/tmp/kraft-combined-logs"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
  backend:
    build: ./backend
    ports: ["127.0.0.1:18080:8080"]
    depends_on:
      db: {condition: service_healthy}
      kafka: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  worker:
    build: ./worker
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PROCESSING_SECONDS: "3"
    depends_on:
      backend: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:15173:80"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  database:
  kafka-data:
